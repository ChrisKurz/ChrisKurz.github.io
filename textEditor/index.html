<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Editor</title>
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="Text Editor">
        <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M7 3.5h13l6 6V28.5H7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M20 3.5v7h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M12 15l-3 3 3 3M20 15l3 3-3 3M17.5 14l-3 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Text Editor</span>
      </div>
    <nav class="menu">
      <button data-action="new" title="Ctrl+N">New</button>
      <button data-action="open" title="Ctrl+O">Open</button>
      <button data-action="open-folder">Open Folder</button>
      <button data-action="save" title="Ctrl+S">Save</button>
      <button data-action="save-as">Save As</button>
      <button data-action="format" title="Ctrl+Shift+F">Format C</button>
      <button data-action="split" id="splitButton" title="Ctrl+\">⬛⬜ Split</button>
    </nav>
    <div class="top-spacer"></div>
    <button id="themeButton" class="icon-button" title="Toggle theme">☾</button>
    <button data-action="search" class="search-button" title="Ctrl+F">⌕ Search</button>
  </header>

  <main class="app">
    <div class="panes" id="panes">
      <div class="pane-mount" id="paneMount0"></div>
      <div class="pane-splitter" id="paneSplitter" hidden></div>
      <div class="pane-mount" id="paneMount1" hidden></div>
    </div>

    <footer class="statusbar">
      <span id="fileStatus">No file open</span>
      <span id="languageStatus">Plain Text</span>
      <span id="encodingStatus">UTF-8</span>
      <span id="positionStatus">Ln 1, Col 1</span>
    </footer>
  </main>

  <input id="fileInput" type="file" multiple hidden>
  <input id="folderInput" type="file" webkitdirectory multiple hidden>

  <div id="closeModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="closeModalTitle">
    <div class="close-modal">
      <h2 id="closeModalTitle">Unsaved changes</h2>
      <p id="closeModalMessage"></p>
      <div class="close-modal-actions">
        <button id="closeCancel" type="button">Cancel</button>
        <button id="closeDiscard" type="button" class="danger">Close without saving</button>
        <button id="closeSave" type="button" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
